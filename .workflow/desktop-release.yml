# template=true
name: crewon-desktop-release

# Builds the installers users download and the manifest the in-app updater reads.
#
# Yunxiao's public build clusters are Linux only, and Tauri cannot cross-compile a
# bundle: a DMG needs macOS `hdiutil`, an NSIS installer needs Windows. Both legs
# therefore run on a private build cluster of self-hosted machines. See
# `docs/desktop-release.md` for what those machines need.
#
# Triggered by a `desktop-v*` tag so a release is an explicit act, not a side
# effect of landing on a branch.
#
# `template=true` for one reason: Windows is optional. Only a Mac is connected
# today, and a `needs` on a job that does not exist would block every release. Set
# `windows` to true once a Windows machine joins the cluster.

variables:
  - key: windows
    type: Object
    value: false

sources:
  repo:
    type: codeup
    name: crewon
    endpoint: https://codeup.aliyun.com/69b2f0ba9df7fdfa6546be32/ccai/crewon.git
    branch: main
    triggerEvents:
      - tagPush
    certificate:
      type: serviceConnection
      # Flow -> 全局设置 -> 服务连接
      serviceConnection: <your-service-connection-id>

# Private variables cannot be declared in YAML. The signing key authorises every
# update this app will install, so it comes from a variable group configured in
# the UI and marked private. See docs/desktop-release.md.
variableGroups:
  - crewon-desktop-signing

stages:
{{ if .windows }}
  # Windows runs first and alone, because the release job is on macOS and needs
  # its artifacts. Each job is a fresh environment that is destroyed afterwards,
  # so nothing is shared except what gets uploaded.
  windows:
    name: Windows 打包
    jobs:
      bundle:
        name: Windows (x64)
        runsOn:
          group: private/<your-private-cluster-id>
          # Windows and macOS only support the VM environment, so `vm: true` is
          # required rather than optional.
          labels: windows,amd64
          vm: true
        steps:
          build:
            step: Command
            name: 构建并签名
            with:
              # PowerShell: the Windows runner has no POSIX shell. Everything this
              # calls is Node for the same reason.
              run: |
                $ErrorActionPreference = "Stop"

                # The Runner is a service and does not see per-user PATH entries,
                # which is where rustup and pnpm install. Same problem the macOS
                # leg has, different cause.
                . scripts/ci/windows-build-env.ps1

                if (-not $env:BUILD_DISK) { throw "BUILD_DISK is not set on this runner" }
                $env:CARGO_TARGET_DIR = Join-Path $env:BUILD_DISK "cargo-target"
                New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR | Out-Null

                $env:CREWON_SIDECAR_TARGET = "x86_64-pc-windows-msvc"

                corepack enable
                pnpm install --frozen-lockfile
                pnpm --filter @crewon/ui sidecar:stage
                pnpm --filter @crewon/ui exec tauri build --target x86_64-pc-windows-msvc
          upload:
            step: ArtifactUpload
            name: 上传制品
            with:
              uploadType: flowPublic
              artifact: windows
              filePath:
                # Installer, updater archive, and signature all live here.
                - apps/crewon-ui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
{{ end }}

  release:
    name: macOS 打包并发布
    jobs:
      bundle:
        name: macOS (Apple Silicon) + 发布
{{ if .windows }}
        needs: windows.bundle
{{ end }}
        runsOn:
          group: private/<your-private-cluster-id>
          labels: darwin,arm64
          vm: true
        steps:
{{ if .windows }}
          fetch_windows:
            step: ArtifactDownload
            name: 取回 Windows 制品
            with:
              artifact: $[stages.windows.bundle.upload.artifacts.windows]
              downloadPath: ./dist-windows
{{ end }}
          build:
            step: Command
            name: 构建并签名
            with:
              run: |
                set -euo pipefail

                # The Runner is started by launchd and inherits none of a login
                # shell's environment: cargo, node, pnpm and ossutil all live
                # outside the default PATH, so without this the first command
                # fails with `command not found`. Sourced from the repo rather
                # than configured on the machine so it is reviewable.
                #
                # `|| exit 1` because a sourced script cannot abort its caller.
                . scripts/ci/macos-build-env.sh || exit 1

                : "${BUILD_DISK:?BUILD_DISK is not set on this runner}"
                export CARGO_TARGET_DIR="${BUILD_DISK}/cargo-target"
                mkdir -p "$CARGO_TARGET_DIR"

                # Skips the Finder-arranging AppleScript in DMG bundling, which
                # needs automation permission a Runner session does not have.
                # Without this the build compiles everything and then fails.
                # A self-hosted Runner does not set CI for you.
                export CI=true
                export CREWON_SIDECAR_TARGET=aarch64-apple-darwin

                corepack enable
                pnpm install --frozen-lockfile
                pnpm --filter @crewon/ui sidecar:stage
                pnpm --filter @crewon/ui exec tauri build --target aarch64-apple-darwin
          publish:
            step: Command
            name: 生成清单并发布
            with:
              # One step, in this order, on purpose: the manifest names files by
              # URL, so it has to be written before upload and uploaded last.
              run: |
                set -euo pipefail

                # Each step is its own shell, so the PATH set up above is gone.
                . scripts/ci/macos-build-env.sh || exit 1

                MAC_BUNDLE=apps/crewon-ui/src-tauri/target/aarch64-apple-darwin/release/bundle

                node scripts/build-update-manifest.mjs \
                  --tag "$CREWON_RELEASE_TAG" \
                  --mac "$MAC_BUNDLE/macos" \
{{ if .windows }}
                  --windows ./dist-windows \
{{ end }}
                  --out latest.json

                node scripts/publish-release.mjs \
                  --tag "$CREWON_RELEASE_TAG" \
                  --manifest latest.json \
{{ if .windows }}
                  --windows ./dist-windows \
{{ end }}
                  --mac "$MAC_BUNDLE"
            env:
              # Flow exposes the triggering tag here; the release scripts check it
              # against the version in package.json and refuse a mismatch.
              CREWON_RELEASE_TAG: $[sources.repo.tag]
          upload:
            step: ArtifactUpload
            name: 留存制品
            with:
              # OSS is what users and the updater read. This copy exists so a
              # release can be inspected from Flow without going to the bucket.
              uploadType: flowPublic
              artifact: release
              filePath:
                - apps/crewon-ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/
                - latest.json
