name: crewon-desktop-ci

# Checks what a Linux cluster can check: types, tests, and that the release
# scripts still parse and validate. Bundling is deliberately absent -- it needs
# macOS and Windows machines, which only the release pipeline has, and running it
# per merge request would monopolise them for an hour at a time.
#
# The bundle is therefore proved at release time, not per change. That is a real
# gap: a Windows-only break lands and is found on the next release.

sources:
  repo:
    type: codeup
    name: crewon
    endpoint: https://codeup.aliyun.com/69b2f0ba9df7fdfa6546be32/ccai/crewon.git
    branch: main
    triggerEvents:
      - mergeRequestOpenedOrUpdate
    certificate:
      type: serviceConnection
      serviceConnection: <your-service-connection-id>

stages:
  check:
    name: 检查
    jobs:
      frontend:
        name: 前端类型与测试
        runsOn: public/cn-hangzhou
        steps:
          setup:
            step: Command
            name: 安装依赖
            with:
              run: |
                set -euo pipefail
                corepack enable
                pnpm install --frozen-lockfile
          typecheck:
            step: Command
            name: 类型检查
            with:
              run: pnpm --filter @crewon/ui lint
          test:
            step: Command
            name: 单元测试
            with:
              run: pnpm --filter @crewon/ui test
          release_scripts:
            step: Command
            name: 校验发布脚本
            with:
              # These only run during a release, so a syntax error or a broken
              # argument check would otherwise surface at the worst moment.
              # `--dry-run` writes nothing; the failing cases assert the guards
              # that stop a mismatched or unsigned release from publishing.
              run: |
                set -euo pipefail

                node scripts/release-desktop.mjs 0.0.1 --dry-run

                if node scripts/build-update-manifest.mjs --tag desktop-v9.9.9 --mac . 2>/dev/null; then
                  echo "manifest builder accepted a tag that does not match the bundle version" >&2
                  exit 1
                fi

                if node scripts/publish-release.mjs --manifest missing.json 2>/dev/null; then
                  echo "publisher accepted a call with no --tag" >&2
                  exit 1
                fi
