server {
    listen 6175 ssl;
    server_name 123.56.172.85;

    ssl_certificate /etc/crewon/tls/crewon-ip.pem;
    ssl_certificate_key /etc/crewon/tls/crewon-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /crewon-health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Production Web Control boundary. The browser's HttpOnly identity cookie
    # terminates at the BFF. nginx deliberately removes any browser-supplied
    # bearer before forwarding; only the BFF may obtain Control authority.
    location = /control-api/session {
        auth_basic off;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header X-CrewON-BFF-Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_buffering off;
    }

    location = /control-api/health/live {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header X-CrewON-BFF-Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_buffering off;
    }

    location = /api/v1 {
        auth_basic off;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header X-CrewON-BFF-Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/v1/ {
        auth_basic off;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header X-CrewON-BFF-Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /site.webmanifest {
        auth_basic off;
        try_files $uri =404;
    }

    # Agent Platform authenticates these requests with its own bearer token.
    # Requiring HTTP Basic here would compete for the Authorization header and
    # cause the post-login /auth/me request to be rejected by nginx.
    location /agent-platform-api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
