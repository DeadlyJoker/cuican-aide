server {
    listen 6175 ssl;
    server_name 123.56.172.85;

    ssl_certificate /etc/crewon/tls/crewon-ip.pem;
    ssl_certificate_key /etc/crewon/tls/crewon-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    auth_basic "CrewON";
    auth_basic_user_file /etc/crewon/htpasswd;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /crewon-health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /site.webmanifest {
        auth_basic off;
        try_files $uri =404;
    }

    location /app-server {
        proxy_pass http://127.0.0.1:6176;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Agent Platform authenticates these requests with its own bearer token.
    # Requiring HTTP Basic here would compete for the Authorization header and
    # cause the post-login /auth/me request to be rejected by nginx.
    location /agent-platform-api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
