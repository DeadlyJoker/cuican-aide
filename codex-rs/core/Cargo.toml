[package]
edition.workspace = true
license.workspace = true
name = "crewon-core"
version.workspace = true

[lib]
name = "crewon_core"
path = "src/lib.rs"

[[bin]]
name = "crewon-write-config-schema"
path = "src/bin/config_schema.rs"

[[bin]]
name = "test_stdio_server"
path = "../rmcp-client/src/bin/test_stdio_server.rs"
test = false
doc = false

[[bin]]
name = "test_streamable_http_server"
path = "../rmcp-client/src/bin/test_streamable_http_server.rs"
test = false
doc = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
crewon-analytics = { workspace = true }
crewon-api = { workspace = true }
crewon-app-server-protocol = { workspace = true }
crewon-apply-patch = { workspace = true }
crewon-async-utils = { workspace = true }
crewon-code-mode = { workspace = true }
crewon-connectors = { workspace = true }
crewon-context-fragments = { workspace = true }
crewon-config = { workspace = true }
crewon-core-plugins = { workspace = true }
crewon-core-skills = { workspace = true }
crewon-exec-server = { workspace = true }
crewon-extension-api = { workspace = true }
crewon-features = { workspace = true }
crewon-feedback = { workspace = true }
crewon-login = { workspace = true }
crewon-memories-read = { workspace = true }
crewon-mcp = { workspace = true }
crewon-model-provider-info = { workspace = true }
crewon-models-manager = { workspace = true }
crewon-shell-command = { workspace = true }
crewon-execpolicy = { workspace = true }
crewon-git-utils = { workspace = true }
crewon-hooks = { workspace = true }
crewon-install-context = { workspace = true }
crewon-network-proxy = { workspace = true }
crewon-otel = { workspace = true }
crewon-plugin = { workspace = true }
crewon-model-provider = { workspace = true }
crewon-protocol = { workspace = true }
crewon-response-debug-context = { workspace = true }
crewon-prompts = { workspace = true }
crewon-rollout = { workspace = true }
crewon-rollout-trace = { workspace = true }
crewon-rmcp-client = { workspace = true }
crewon-sandboxing = { workspace = true }
crewon-scene-runtime = { workspace = true }
crewon-state = { workspace = true }
crewon-terminal-detection = { workspace = true }
crewon-thread-store = { workspace = true }
crewon-tools = { workspace = true }
crewon-utils-absolute-path = { workspace = true }
crewon-utils-cache = { workspace = true }
crewon-utils-image = { workspace = true }
crewon-utils-home-dir = { workspace = true }
crewon-utils-output-truncation = { workspace = true }
crewon-utils-path = { workspace = true }
crewon-utils-plugins = { workspace = true }
crewon-utils-pty = { workspace = true }
crewon-utils-string = { workspace = true }
crewon-utils-stream-parser = { workspace = true }
crewon-windows-sandbox = { package = "crewon-windows-sandbox", path = "../windows-sandbox-rs" }
csv = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
rmcp = { workspace = true, default-features = false, features = [
    "auth",
    "base64",
    "macros",
    "schemars",
    "server",
    "transport-streamable-http-server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
crewon-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
crewon-image-generation-extension = { workspace = true }
crewon-otel = { workspace = true }
crewon-test-binary-support = { workspace = true }
crewon-utils-cargo-bin = { workspace = true }
crewon-web-search-extension = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
