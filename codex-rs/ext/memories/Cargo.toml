[package]
edition.workspace = true
license.workspace = true
name = "crewon-memories-extension"
version.workspace = true

[lib]
name = "crewon_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
crewon-core = { workspace = true }
crewon-extension-api = { workspace = true }
crewon-features = { workspace = true }
crewon-otel = { workspace = true }
crewon-tools = { workspace = true }
crewon-utils-absolute-path = { workspace = true }
crewon-utils-output-truncation = { workspace = true }
crewon-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
