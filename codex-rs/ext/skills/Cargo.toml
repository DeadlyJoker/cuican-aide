[package]
edition.workspace = true
license.workspace = true
name = "crewon-skills-extension"
version.workspace = true

[lib]
name = "crewon_skills_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
crewon-core-skills = { workspace = true }
crewon-exec-server = { workspace = true }
crewon-extension-api = { workspace = true }
crewon-mcp = { workspace = true }
crewon-protocol = { workspace = true }
crewon-tools = { workspace = true }
crewon-utils-absolute-path = { workspace = true }
crewon-utils-string = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
