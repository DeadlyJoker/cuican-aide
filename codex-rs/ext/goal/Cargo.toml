[package]
edition.workspace = true
license.workspace = true
name = "crewon-goal-extension"
version.workspace = true

[lib]
name = "crewon_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
crewon-analytics = { workspace = true }
crewon-core = { workspace = true }
crewon-extension-api = { workspace = true }
crewon-otel = { workspace = true }
crewon-protocol = { workspace = true }
crewon-state = { workspace = true }
crewon-tools = { workspace = true }
crewon-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
