[package]
edition.workspace = true
license.workspace = true
name = "crewon-analytics"
version.workspace = true

[lib]
doctest = false
name = "crewon_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
crewon-app-server-protocol = { workspace = true }
crewon-git-utils = { workspace = true }
crewon-login = { workspace = true }
crewon-model-provider = { workspace = true }
crewon-plugin = { workspace = true }
crewon-protocol = { workspace = true }
crewon-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
crewon-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
