[package]
edition.workspace = true
license.workspace = true
name = "crewon-model-provider"
version.workspace = true

[lib]
doctest = false
name = "crewon_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
crewon-api = { workspace = true }
crewon-agent-identity = { workspace = true }
crewon-aws-auth = { workspace = true }
crewon-client = { workspace = true }
crewon-feedback = { workspace = true }
crewon-login = { workspace = true }
crewon-model-provider-info = { workspace = true }
crewon-models-manager = { workspace = true }
crewon-otel = { workspace = true }
crewon-protocol = { workspace = true }
crewon-response-debug-context = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
