[package]
edition.workspace = true
license.workspace = true
name = "crewon-memories-write"
version.workspace = true

[lib]
name = "crewon_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
crewon-backend-client = { workspace = true }
crewon-core = { workspace = true }
crewon-config = { workspace = true }
crewon-features = { workspace = true }
crewon-git-utils = { workspace = true }
crewon-login = { workspace = true }
crewon-model-provider = { workspace = true }
crewon-otel = { workspace = true }
crewon-protocol = { workspace = true }
crewon-rollout = { workspace = true }
crewon-rollout-trace = { workspace = true }
crewon-secrets = { workspace = true }
crewon-state = { workspace = true }
crewon-terminal-detection = { workspace = true }
crewon-utils-absolute-path = { workspace = true }
crewon-utils-output-truncation = { workspace = true }
crewon-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
crewon-model-provider-info = { workspace = true }
crewon-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
