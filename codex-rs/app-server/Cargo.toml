[package]
name = "crewon-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "crewon-app-server"
path = "src/main.rs"

[[bin]]
name = "crewon-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[lib]
name = "crewon_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
crewon-analytics = { workspace = true }
crewon-arg0 = { workspace = true }
crewon-cloud-config = { workspace = true }
crewon-config = { workspace = true }
crewon-core = { workspace = true }
crewon-core-plugins = { workspace = true }
crewon-exec-server = { workspace = true }
crewon-extension-api = { workspace = true }
crewon-external-agent-migration = { workspace = true }
crewon-external-agent-sessions = { workspace = true }
crewon-features = { workspace = true }
crewon-goal-extension = { workspace = true }
crewon-guardian = { workspace = true }
crewon-git-utils = { workspace = true }
crewon-file-watcher = { workspace = true }
crewon-hooks = { workspace = true }
crewon-otel = { workspace = true }
crewon-plugin = { workspace = true }
crewon-shell-command = { workspace = true }
crewon-skills-extension = { workspace = true }
crewon-utils-options = { workspace = true }
crewon-utils-pty = { workspace = true }
crewon-backend-client = { workspace = true }
crewon-file-search = { workspace = true }
crewon-chatgpt = { workspace = true }
crewon-login = { workspace = true }
crewon-image-generation-extension = { workspace = true }
crewon-memories-extension = { workspace = true }
crewon-web-search-extension = { workspace = true }
crewon-memories-write = { workspace = true }
crewon-mcp = { workspace = true }
crewon-mcp-extension = { workspace = true }
crewon-model-provider = { workspace = true }
crewon-models-manager = { workspace = true }
crewon-protocol = { workspace = true }
crewon-app-server-protocol = { workspace = true }
crewon-app-server-transport = { workspace = true }
crewon-feedback = { workspace = true }
crewon-rmcp-client = { workspace = true }
crewon-rollout = { workspace = true }
crewon-sandboxing = { workspace = true }
crewon-state = { workspace = true }
crewon-thread-store = { workspace = true }
crewon-tools = { workspace = true }
crewon-utils-absolute-path = { workspace = true }
crewon-utils-json-to-toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
uuid = { workspace = true, features = ["serde", "v7"] }

[target.'cfg(windows)'.dependencies]
crewon-windows-sandbox = { workspace = true }

[dev-dependencies]
app_test_support = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
