[package]
name = "crewon-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "crewon_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
crewon-app-server = { workspace = true }
crewon-app-server-protocol = { workspace = true }
crewon-arg0 = { workspace = true }
crewon-config = { workspace = true }
crewon-core = { workspace = true }
crewon-exec-server = { workspace = true }
crewon-feedback = { workspace = true }
crewon-protocol = { workspace = true }
crewon-uds = { workspace = true }
crewon-utils-absolute-path = { workspace = true }
crewon-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
