[package]
name = "crewon-ui"
version = "0.1.0"
description = "Crewon desktop client"
authors = ["Crewon"]
edition = "2021"

[lib]
name = "crewon_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.9.4", features = ["macos-private-api"] }
tauri-plugin-shell = "2.3.5"
# `generate_context!` expands plugin config into `serde_json` calls, so the crate
# has to name it even though no hand-written code touches it.
serde_json = "1"

# Desktop-only: the updater has no meaning on mobile targets, and building it
# there fails outright.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
