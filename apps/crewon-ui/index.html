<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' crewon-plugin://ui; style-src 'self' 'unsafe-inline' crewon-plugin://ui; img-src 'self' data: blob: https: crewon-plugin://ui; font-src 'self' data: crewon-plugin://ui; connect-src 'self' http: https: ws: wss: crewon-plugin://ui; frame-src http: https:; worker-src 'self' blob:"
    />
    <meta
      name="description"
      content="CrewON brings your assistants, teams, schedules, knowledge, and workspaces together."
    />
    <meta name="theme-color" content="#101214" />
    <link rel="icon" type="image/svg+xml" href="./crewon.svg" />
    <link
      rel="manifest"
      href="./site.webmanifest"
      crossorigin="use-credentials"
    />
    <title>CrewON</title>
  </head>
  <body>
    <div id="root">
      <div class="crewon-startup" role="status">正在启动 CrewON…</div>
    </div>
    <style>
      .crewon-startup {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          15px system-ui,
          sans-serif;
        color: #262626;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        .crewon-startup {
          color: #ededed;
          background: #191919;
        }
      }
    </style>
    <script data-cfasync="false" type="module" src="/src/main.tsx"></script>

</html>
