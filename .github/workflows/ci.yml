name: ci

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify Crewon Rust Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the architecture foundation
        run: pnpm --filter './packages/**' -r typecheck

      - name: Test the architecture foundation
        run: pnpm --filter './packages/**' -r test

      - name: Typecheck the Control API
        run: pnpm --filter @crewon/control-api typecheck

      - name: Test the Control API
        run: pnpm --filter @crewon/control-api test

      - name: Verify the Web BFF production boundary
        run: |
          pnpm --filter @crewon/web-bff typecheck
          pnpm --filter @crewon/web-bff test
          pnpm --filter @crewon/web-bff production:gate

      - name: Typecheck the Runtime Worker
        run: pnpm --filter @crewon/runtime-worker typecheck

      - name: Test the Runtime Worker
        run: pnpm --filter @crewon/runtime-worker test

      - name: Test desktop sidecar staging contract
        run: node --test scripts/desktop-release-tools.test.mjs scripts/stage-desktop-runtime.test.mjs

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Check formatting (run `just fmt` to fix)
        run: just fmt-check

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

      - name: Typecheck the UI
        run: pnpm --filter @crewon/ui lint

      - name: Build the web production bundle
        run: pnpm --filter @crewon/ui build

      - name: Build fresh Web production images
        run: |
          docker build -t crewon-web:ci -f deploy/crewon/web.Dockerfile .
          docker build -t crewon-web-bff:ci -f deploy/crewon/web-bff.Dockerfile .
          docker run --rm crewon-web:ci sh -c '
            grep -F "location = /control-api/session" /etc/nginx/conf.d/default.conf &&
            grep -F "location /api/v1/" /etc/nginx/conf.d/default.conf &&
            ! grep -E "app-server|6176|agent-platform-api|127\\.0\\.0\\.1:8000" /etc/nginx/conf.d/default.conf
          '

      - name: Build pure TypeScript Control and Runtime images
        run: |
          node --test deploy/crewon/control-runtime-images.test.mjs
          node deploy/crewon/check-production-topology.mjs
          docker build -t crewon-control-api:ci -f deploy/crewon/control-api.Dockerfile .
          docker build -t crewon-runtime-worker:ci -f deploy/crewon/runtime-worker.Dockerfile .
          test "$(docker image inspect -f '{{.Config.User}}' crewon-control-api:ci)" = node
          test "$(docker image inspect -f '{{.Config.User}}' crewon-runtime-worker:ci)" = node
          docker run --rm --entrypoint sh crewon-control-api:ci -c '
            test -f /app/control-api.mjs &&
            ! grep -aEi "deterministic[ _-]?fake|device[ _-]?gateway|app[ _-]?server|6176" /app/control-api.mjs
          '
          docker run --rm --entrypoint sh crewon-runtime-worker:ci -c '
            test -f /app/runtime-worker.mjs &&
            test -f /app/init/release-main.mjs &&
            ! grep -aEi "deterministic[ _-]?fake|device[ _-]?gateway|app[ _-]?server|6176" /app/runtime-worker.mjs /app/init/release-main.mjs
          '
          volume="crewon-artifacts-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          cleanup_artifact_volume() {
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup_artifact_volume EXIT
          docker run --rm -v "$volume:/var/lib/crewon/artifacts" \
            --entrypoint sh crewon-control-api:ci -c \
            'test -w /var/lib/crewon/artifacts && touch /var/lib/crewon/artifacts/control-write'
          docker run --rm -v "$volume:/var/lib/crewon/artifacts" \
            --entrypoint sh crewon-runtime-worker:ci -c \
            'test -w /var/lib/crewon/artifacts && test -f /var/lib/crewon/artifacts/control-write && touch /var/lib/crewon/artifacts/worker-write'
          docker volume rm "$volume"
          trap - EXIT
          CREWON_CONTROL_ENV_FILE=control.production.env.example \
          CREWON_RUNTIME_ENV_FILE=runtime.production.env.example \
          CREWON_WEB_BFF_ENV_FILE=web-bff.production.env.example \
          CREWON_CONTROL_API_IMAGE=crewon-control-api:ci \
          CREWON_RUNTIME_WORKER_IMAGE=crewon-runtime-worker:ci \
          CREWON_WEB_BFF_IMAGE=crewon-web-bff:ci \
          CREWON_WEB_IMAGE=crewon-web:ci \
          docker compose --env-file deploy/crewon/compose.host.env.example \
            -f deploy/crewon/compose.production.yml config --quiet

      - name: Test the UI
        run: pnpm --filter @crewon/ui test
