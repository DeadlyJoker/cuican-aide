name: ci

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  postgres-production-workflow:
    name: PostgreSQL production Workflow recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: crewon_test
          POSTGRES_PASSWORD: crewon_test
          POSTGRES_USER: crewon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewon_test -d crewon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CREWON_TEST_POSTGRES_URL: postgresql://crewon_test:crewon_test@127.0.0.1:5432/crewon_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Exercise the complete serialized PostgreSQL Store contract
        run: node scripts/postgres-store-contract-gate.mjs
      - name: Exercise production PostgreSQL Workflow recovery
        run: pnpm production:postgres-smoke

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify Crewon Rust Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the architecture foundation
        run: pnpm --filter './packages/**' -r typecheck

      - name: Test the architecture foundation
        run: pnpm --filter './packages/**' -r test

      - name: Typecheck the Control API
        run: pnpm --filter @crewon/control-api typecheck

      - name: Test the Control API
        run: pnpm --filter @crewon/control-api test

      - name: Verify the Web BFF production boundary
        run: |
          pnpm --filter @crewon/web-bff typecheck
          pnpm --filter @crewon/web-bff test
          pnpm --filter @crewon/web-bff production:gate

      - name: Typecheck the Runtime Worker
        run: pnpm --filter @crewon/runtime-worker typecheck

      - name: Test the Runtime Worker
        run: pnpm --filter @crewon/runtime-worker test

      - name: Test desktop sidecar staging contract
        run: node --test scripts/desktop-release-tools.test.mjs scripts/desktop-release-workflow.test.mjs scripts/postgres-store-contract-gate.test.mjs scripts/stage-desktop-runtime.test.mjs scripts/server-release-tools.test.mjs scripts/server-release-workflow.test.mjs

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Check formatting (run `just fmt` to fix)
        run: just fmt-check

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

      - name: Typecheck the UI
        run: pnpm --filter @crewon/ui lint

      - name: Build the web production bundle
        run: pnpm --filter @crewon/ui build

      - name: Build fresh Web production images
        run: |
          docker build -t crewon-web:ci -f deploy/crewon/web.Dockerfile .
          docker build -t crewon-web-bff:ci -f deploy/crewon/web-bff.Dockerfile .
          test "$(docker image inspect -f '{{.Config.User}}' crewon-web:ci)" = nginx
          test "$(docker image inspect -f '{{.Config.User}}' crewon-web-bff:ci)" = node
          docker run --rm --entrypoint sh crewon-web-bff:ci -c '
            test -f /app/web-bff.mjs &&
            test ! -e /app/src &&
            ! grep -aEi "deterministic[ _-]?fake|device[ _-]?gateway|app[ _-]?server|6176" /app/web-bff.mjs
          '
          docker run --rm crewon-web:ci sh -c '
            grep -F "location = /control-api/session" /etc/nginx/conf.d/default.conf &&
            grep -F "location = /control-api/health/live" /etc/nginx/conf.d/default.conf &&
            grep -F "location = /control-api/health/ready" /etc/nginx/conf.d/default.conf &&
            grep -F "location /api/v1/" /etc/nginx/conf.d/default.conf &&
            grep -F "Content-Security-Policy" /etc/nginx/conf.d/default.conf &&
            grep -F "script-src 'self'" /etc/nginx/conf.d/default.conf &&
            ! grep -F "unsafe-eval" /etc/nginx/conf.d/default.conf &&
            ! grep -E "app-server|6176|agent-platform-api|127\\.0\\.0\\.1:8000" /etc/nginx/conf.d/default.conf
          '
          web_tls_dir="$(mktemp -d)"
          web_container="crewon-web-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker stop "$web_container" >/dev/null 2>&1 || true' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$web_tls_dir/crewon-ip.key" \
            -out "$web_tls_dir/crewon-ip.pem" \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          chmod 0644 "$web_tls_dir/crewon-ip.pem" "$web_tls_dir/crewon-ip.key"
          web_runtime_flags=(
            --read-only
            --cap-drop ALL
            --security-opt no-new-privileges:true
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
            -v "$web_tls_dir/crewon-ip.pem:/etc/crewon/tls/crewon-ip.pem:ro"
            -v "$web_tls_dir/crewon-ip.key:/etc/crewon/tls/crewon-ip.key:ro"
          )
          docker run --rm "${web_runtime_flags[@]}" crewon-web:ci nginx -t
          docker run -d --rm --name "$web_container" \
            "${web_runtime_flags[@]}" -p 127.0.0.1::6175 crewon-web:ci
          web_address="$(docker port "$web_container" 6175/tcp)"
          web_ready=false
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error --insecure \
              --dump-header "$web_tls_dir/headers" \
              --output "$web_tls_dir/body" \
              "https://$web_address/crewon-health"; then
              web_ready=true
              break
            fi
            sleep 0.25
          done
          test "$web_ready" = true
          grep -Fx healthy "$web_tls_dir/body"
          grep -i '^Content-Security-Policy:' "$web_tls_dir/headers"
          grep -i '^Strict-Transport-Security:' "$web_tls_dir/headers"
          grep -i '^X-Content-Type-Options: nosniff' "$web_tls_dir/headers"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$web_container")" = true
          test "$(docker inspect -f '{{json .HostConfig.CapDrop}}' "$web_container")" = '["ALL"]'
          docker stop "$web_container"
          trap - EXIT

      - name: Build pure TypeScript Control and Runtime images
        run: |
          node --test deploy/crewon/control-runtime-images.test.mjs
          node deploy/crewon/check-production-topology.mjs
          docker build -t crewon-control-api:ci -f deploy/crewon/control-api.Dockerfile .
          docker build -t crewon-runtime-worker:ci -f deploy/crewon/runtime-worker.Dockerfile .
          test "$(docker image inspect -f '{{.Config.User}}' crewon-control-api:ci)" = node
          test "$(docker image inspect -f '{{.Config.User}}' crewon-runtime-worker:ci)" = node
          docker run --rm --entrypoint sh crewon-control-api:ci -c '
            test -f /app/control-api.mjs &&
            ! grep -aEi "deterministic[ _-]?fake|device[ _-]?gateway|app[ _-]?server|6176" /app/control-api.mjs
          '
          docker run --rm --entrypoint sh crewon-runtime-worker:ci -c '
            test -f /app/runtime-worker.mjs &&
            test -f /app/init/release-main.mjs &&
            test -f /app/init/release-rollback-main.mjs &&
            test -f /app/ops/production-backup-main.mjs &&
            pg_dump --version | grep -E " 16[.]" && command -v pg_restore &&
            ! grep -aEi "deterministic[ _-]?fake|device[ _-]?gateway|app[ _-]?server|6176" /app/runtime-worker.mjs /app/init/release-main.mjs /app/init/release-rollback-main.mjs /app/ops/production-backup-main.mjs
          '
          CREWON_RUNTIME_WORKER_BACKUP_IMAGE=crewon-runtime-worker:ci \
            node --experimental-strip-types --test \
            scripts/production-backup-postgres-smoke.test.ts
          volume="crewon-artifacts-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          cleanup_artifact_volume() {
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup_artifact_volume EXIT
          docker run --rm -v "$volume:/var/lib/crewon/artifacts" \
            --entrypoint sh crewon-control-api:ci -c \
            'test -w /var/lib/crewon/artifacts && touch /var/lib/crewon/artifacts/control-write'
          docker run --rm -v "$volume:/var/lib/crewon/artifacts" \
            --entrypoint sh crewon-runtime-worker:ci -c \
            'test -w /var/lib/crewon/artifacts && test -f /var/lib/crewon/artifacts/control-write && touch /var/lib/crewon/artifacts/worker-write'
          docker volume rm "$volume"
          trap - EXIT
          CREWON_CONTROL_ENV_FILE=control.production.env.example \
          CREWON_RUNTIME_ENV_FILE=runtime.production.env.example \
          CREWON_WEB_BFF_ENV_FILE=web-bff.production.env.example \
          CREWON_BACKUP_ENV_FILE=backup.production.env.example \
          CREWON_CONTROL_API_IMAGE=ghcr.io/example/crewon-control-api@sha256:1111111111111111111111111111111111111111111111111111111111111111 \
          CREWON_RUNTIME_WORKER_IMAGE=ghcr.io/example/crewon-runtime-worker@sha256:2222222222222222222222222222222222222222222222222222222222222222 \
          CREWON_WEB_BFF_IMAGE=ghcr.io/example/crewon-web-bff@sha256:3333333333333333333333333333333333333333333333333333333333333333 \
          CREWON_WEB_IMAGE=ghcr.io/example/crewon-web@sha256:4444444444444444444444444444444444444444444444444444444444444444 \
          docker compose --env-file deploy/crewon/compose.host.env.example \
            -f deploy/crewon/compose.production.yml config --quiet

      - name: Test the UI
        run: pnpm --filter @crewon/ui test
