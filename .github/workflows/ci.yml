name: ci

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the TypeScript product boundary
        run: pnpm crewon:boundary:check

      - name: Verify protocol closure
        run: pnpm --filter @crewon/app-server-protocol check

      - name: Typecheck the architecture foundation
        run: pnpm --filter './packages/**' -r typecheck

      - name: Test the architecture foundation
        run: pnpm --filter './packages/**' -r test

      - name: Typecheck the Control API
        run: pnpm --filter @crewon/control-api typecheck

      - name: Test the Control API
        run: pnpm --filter @crewon/control-api test

      - name: Typecheck the Runtime Worker
        run: pnpm --filter @crewon/runtime-worker typecheck

      - name: Test the Runtime Worker
        run: pnpm --filter @crewon/runtime-worker test

      - name: Typecheck the Device Gateway
        run: pnpm --filter @crewon/device-gateway typecheck

      - name: Test the Device Gateway
        run: pnpm --filter @crewon/device-gateway test

      - name: Test desktop runtime staging contract
        run: node --experimental-strip-types --test scripts/stage-desktop-runtime.test.ts

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

      - name: Typecheck the UI
        run: pnpm --filter @crewon/ui lint

      - name: Test the UI
        run: pnpm --filter @crewon/ui test
