name: Issue Labeler

on:
  issues:
    types:
      - opened
      - labeled

jobs:
  gather-labels:
    name: Generate label suggestions
    # Prevent runs on forks (requires OpenAI API key, wastes Actions minutes)
    if: ${{ !github.event.repository.fork && (github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'crewon-label')) }}
    runs-on: ubuntu-latest
    environment: issue-triage
    permissions:
      contents: read
    outputs:
      labeler_output: ${{ steps.issue-labeler.outputs.final-message }}
    steps:
      - id: issue-labeler
        uses: openai/codex-action@5c3f4ccdb2b8790f73d6b21751ac00e602aa0c02 # v1.7
        with:
          openai-api-key: ${{ secrets.CREWON_OPENAI_API_KEY }}
          allow-users: "*"
          safety-strategy: drop-sudo
          sandbox: read-only
          prompt: |
            You are an assistant that reviews GitHub issues for the repository.

            Your job is to choose the most appropriate labels for the issue described later in this prompt.
            Follow these rules:

            - Add one (and only one) of the following three labels to distinguish the type of issue. Default to "bug" if unsure.
            1. bug — Reproducible defects in Crewon products (PC, web, mobile, backend, auth).
            2. enhancement — Feature requests or usability improvements that ask for new capabilities, better ergonomics, or quality-of-life tweaks.
            3. documentation — Updates or corrections needed in docs/README/config references (broken links, missing examples, outdated keys, clarification requests).

            - If applicable, add one of the following labels to specify which sub-product or product surface the issue relates to.
            1. pc — Issues related to the Crewon desktop/PC client.
            2. web — Issues targeting the Crewon web client or cloud experience.
            3. mobile — Issues targeting Crewon mobile clients.
            4. backend — Issues related to the Crewon backend, app-server, protocol, or model-provider behavior.
            5. github-action — Issues with GitHub Action automation used by the project.

            - Additionally add zero or more of the following labels that are relevant to the issue content. Prefer a small set of precise labels over many broad ones.
            - For agent-area issues, prefer the most specific applicable label. Use "agent" only as a fallback for agent-related issues that do not fit a more specific agent-area label. Prefer "app-server" over "session" or "config" when the issue is about app-server protocol, API, RPC, schema, launch, or bridge behavior. Use "memory" for agentic memory storage/retrieval and "performance" for high process memory utilization or memory leaks.
            1. windows-os — Bugs or friction specific to Windows environments (always when PowerShell is mentioned, path handling, copy/paste, OS-specific auth or tooling failures).
            2. mcp — Topics involving Model Context Protocol servers/clients.
            3. mcp-server — Problems related to the Crewon MCP server integration.
            4. azure — Problems or requests tied to Azure OpenAI deployments.
            5. model-behavior — Undesirable LLM behavior: forgetting goals, refusing work, hallucinating environment details, quota misreports, or other reasoning/performance anomalies.
            6. code-review — Issues related to the code review feature or functionality.
            7. safety-check - Issues related to cyber risk detection or trusted access verification.
            8. auth - Problems related to authentication, login, or access tokens.
            9. exec - Problems related to execution tools or command running behavior.
            10. hooks - Problems related to event hooks
            11. context - Problems related to compaction, context windows, or available context reporting.
            12. skills - Problems related to skills or plugins
            13. custom-model - Problems that involve using custom model providers, local models, or OSS models.
            14. rate-limits - Problems related to token limits, rate limits, or token usage reporting.
            15. sandbox - Issues related to local sandbox environments or tool call approvals to override sandbox restrictions.
            16. tool-calls - Problems related to specific tool call invocations including unexpected errors, failures, or hangs.
            17. app-server - Issues involving the app-server protocol or interfaces, including API payloads, thread/* and turn/* RPCs, launch behavior, external app/controller bridges, and app-server protocol/schema behavior.
            18. connectivity - Network connectivity or endpoint issues, including reconnecting messages, stream dropped/disconnected errors, websocket/SSE/transport failures, timeout/network/VPN/proxy/API endpoint failures, and related retry behavior.
            19. subagent - Issues involving subagents, sub-agents, or multi-agent behavior, including spawn_agent, wait_agent, close_agent, worker/explorer roles, delegation, agent teams, lifecycle, model/config inheritance, quotas, and orchestration.
            20. session - Issues involving session or thread management, including resume, fork, archive, rename/title, thread history, rollout persistence, compaction, checkpoints, retention, and cross-session state.
            21. config - Issues involving config.toml, config keys, config key merging, config updates, profiles, hooks config, project config, agent role TOMLs, instruction/personality config, and config schema behavior.
            22. plan - Issues involving plan mode, planning workflows, or plan-specific tools/behavior.
            23. computer-use - Issues involving agentic computer use or SkyComputerUseService.
            24. browser - Issues involving agentic browser use, IAB, or built-in browser behavior.
            25. memory - Issues involving agentic memory storage and retrieval.
            26. imagen - Issues involving image generation.
            27. remote - Issues involving remote access, remote control, or SSH.
            28. performance - Issues involving slow, laggy performance, high memory utilization, or memory leaks.
            29. automations - Issues involving scheduled automation tasks or heartbeats.
            30. agent - Fallback only for core agent loop or agent-related issues that do not fit app-server, connectivity, subagent, session, config, plan, computer-use, browser, memory, imagen, remote, performance, or automations.

            Issue number: ${{ github.event.issue.number }}

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Repository full name:
            ${{ github.repository }}

          output-schema: |
            {
              "type": "object",
              "properties": {
                "labels": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                }
              },
              "required": ["labels"],
              "additionalProperties": false
            }

  apply-labels:
    name: Apply labels from labeler output
    needs: gather-labels
    if: ${{ needs.gather-labels.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      LABELER_OUTPUT: ${{ needs.gather-labels.outputs.labeler_output }}
    steps:
      - name: Apply labels
        run: |
          json=${LABELER_OUTPUT//$'\r'/}
          if [ -z "$json" ]; then
            echo "Labeler produced no output. Skipping label application."
            exit 0
          fi

          if ! printf '%s' "$json" | jq -e 'type == "object" and (.labels | type == "array")' >/dev/null 2>&1; then
            echo "Labeler output did not include a labels array. Raw output: $json"
            exit 0
          fi

          labels=$(printf '%s' "$json" | jq -r '.labels[] | tostring')
          if [ -z "$labels" ]; then
            echo "Labeler returned an empty array. Nothing to do."
            exit 0
          fi

          cmd=(gh issue edit "$ISSUE_NUMBER")
          while IFS= read -r label; do
            cmd+=(--add-label "$label")
          done <<< "$labels"

          "${cmd[@]}" || true

      - name: Remove crewon-label trigger
        if: ${{ always() && github.event.action == 'labeled' && github.event.label.name == 'crewon-label' }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label crewon-label || true
          echo "Attempted to remove label: crewon-label"
